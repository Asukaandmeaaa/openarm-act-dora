name: Software reproduction
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build from pinned sources
        run: docker build -t openarm-act-dora .
      - name: Check, test and infer without devices
        run: docker run --rm openarm-act-dora
